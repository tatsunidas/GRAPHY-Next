name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 🚨 上限を切る。2026-08-27 に **macOS ランナーで Maven Central の DNS が引けず
    #    （`repo.maven.apache.org: nodename nor servname provided`）、ミラーも 503** という
    #    一過性のインフラ障害が 3 回続き、そのたびに **1 ジョブが 2 時間走り続けて**から
    #    落ちた。中身は 2 分で終わるので、詰まっているならさっさと落として気付けるようにする。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # テストのゲート。UI 同梱は不要なので frontend はスキップし、3 OS でバックエンドの
      # ビルド＆テストを回す（DICOM 送受信の Windows/POSIX 差異を検出するため）。
      #
      # ⚠ 取得は**再試行させる**。上記の障害は 503 と DNS 失敗の混在で、既定では
      #   1 回失敗しただけでビルド全体が落ちる。接続/読み取りの上限も切って、
      #   1 つの依存で長時間ぶら下がらないようにする。
      - name: Build & test
        working-directory: backend
        shell: bash
        run: |
          mvn -B -Dfrontend.skip=true clean package \
            -Dmaven.wagon.http.retryHandler.count=3 \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
            -Dmaven.wagon.http.connectionTimeout=30000 \
            -Dmaven.wagon.http.readTimeout=60000

  desktop:
    name: Desktop (window geometry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # ウィンドウ位置の検証は Electron 非依存の純関数に切り出してある（windowGeometry.js）。
      # 依存が無いので npm install も要らない。
      - name: Test
        working-directory: desktop
        run: node --test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
