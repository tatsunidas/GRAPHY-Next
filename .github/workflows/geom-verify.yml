name: Geom verify

# ROI・マスク・計測の幾何検証（automator/src/spike/geom*Check.ts の実アプリ検査 8 本）を、
# ubuntu ランナーの xvfb 上で 1 本ずつ走らせる。失敗が 1 件でもあれば赤。未達は表示のみ（run-geom-verify.sh）。
# release.yml から呼ぶ（workflow_call）想定。手動は workflow_dispatch。所要は約 30〜40 分なので paths で絞る。
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/geom-verify.yml"
      - "automator/src/spike/geom*"
      - "automator/src/spike/computeSpikeShared.ts"
      - "automator/src/driver/**"
      - "automator/scripts/*geom*"
      - "automator/scripts/requirements-geom.txt"
      - "frontend/src/viewer/**"
      - "frontend/src/curvedmpr/**"
      - "frontend/src/plugins/**"
      - "backend/src/main/java/**/radiomics/**"
      - "backend/src/main/java/**/seg/**"
      - "backend/src/main/java/**/rtstruct/**"

permissions:
  contents: read

# release から呼ばれたときも github.workflow は呼び出し側の名前になる。固有の接頭辞で他と衝突させない。
concurrency:
  group: geom-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geom-verify:
    name: Geom verify (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Build backend jar (frontend は検査が Vite で開発版を使うので同梱しない)
        working-directory: backend
        run: mvn -B -ntp -Dfrontend.skip=true -DskipTests package
      - name: npm ci (frontend / desktop / automator)
        run: |
          for d in frontend desktop automator; do (cd "$d" && npm ci); done
      - name: Python venv (requirements-geom.txt)
        run: |
          python -m venv "$RUNNER_TEMP/geom-venv"
          "$RUNNER_TEMP/geom-venv/bin/python" -m pip install -q -r automator/scripts/requirements-geom.txt
      - name: Run geom verify (8 本を 1 本ずつ)
        env:
          GRAPHY_TEST_PYTHON: ${{ runner.temp }}/geom-venv/bin/python
          # Electron の chrome-sandbox は SUID が付かない（ランナー専用。製品の起動オプションではない）。
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" bash automator/scripts/run-geom-verify.sh
      - name: Summary
        if: always()
        run: |
          f=automator/.results/geom-verify/summary.txt
          { echo '## Geom verify'; echo '```'; if [ -f "$f" ]; then cat "$f"; else echo '(summary.txt なし: 実行前に落ちた)'; fi; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geom-verify-results
          path: automator/.results
          retention-days: 14
          if-no-files-found: ignore
