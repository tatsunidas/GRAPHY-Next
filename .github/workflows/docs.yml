name: Docs — Build & Deploy

# ユーザーマニュアル (mkdocs) を GitHub Pages へ公開する。
# classic (tatsunidas/GRAPHY) の同名ワークフローに合わせてあるが、PDF 出力は入れていない。
# 初回は リポジトリ設定 > Pages > Source を "GitHub Actions" にしておく必要がある。

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check-docs-labels.py'
      # アプリの画面の文言を変えたら、マニュアルの文言との照合を走らせる
      - 'frontend/src/i18n/ja.ts'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check-docs-labels.py'
      # アプリの画面の文言を変えたら、マニュアルの文言との照合を走らせる
      - 'frontend/src/i18n/ja.ts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Python dependencies
        run: pip install -r requirements-docs.txt

      # マニュアルに `**文言**{.ui}` と書いた画面の文言が、アプリの文言（ja.ts）と一致するか
      - name: Check UI labels
        run: python3 scripts/check-docs-labels.py

      # --strict: リンク切れ / nav 漏れをビルドエラーにする
      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    # PR ではビルド検証のみ。公開は main への push だけ。
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
