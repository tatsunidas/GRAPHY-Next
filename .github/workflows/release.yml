name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # タグと各マニフェストの版数が一致していることを最初に検証する。
  # 一致しないままビルドすると、インストーラ名が旧版のまま公開される
  # （タグ v0.1.7 を package.json=0.1.6 のコミットに打つと 0.1.6 の資産が出る、の再発防止）。
  verify-version:
    name: Verify tag == code version
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 前のタグからの履歴でリリースノートを作るため、全履歴とタグを取る。
          fetch-depth: 0
      - name: タグと desktop/frontend/backend の版数を突き合わせる
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          desktop=$(jq -r .version desktop/package.json)
          frontend=$(jq -r .version frontend/package.json)
          # backend/pom.xml の <project> 直下の version（親 spring-boot の version は除外するため </parent> 以降を見る）
          pom=$(sed -n '/<\/parent>/,$ s/.*<version>\(.*\)<\/version>.*/\1/p' backend/pom.xml | head -1)
          echo "tag=$tag  desktop=$desktop  frontend=$frontend  backend/pom.xml=$pom"
          fail=0
          for pair in "desktop/package.json:$desktop" "frontend/package.json:$frontend" "backend/pom.xml:$pom"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$tag" ]; then
              echo "::error::$name の version ($val) がタグ ($tag) と一致しません"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "リリース中止: 3つの版数をタグ ($tag) に揃えてコミットしてから、そのコミットにタグを打ち直してください。"
            exit 1
          fi
          echo "OK: すべての版数がタグ ($tag) と一致しています。"
      # 新機能／バグ修正などに分けたリリースノート（PR タイトルの feat:/fix: で分類）。
      # 各ジョブのアップロードで同じ本文を渡すので、どのジョブがリリースを作っても同じになる。
      - name: リリースノートを作る
        id: notes
        shell: bash
        env:
          # 前回の「公開済み」リリースを調べるのに使う（下書きに戻した版の変更もこの版に含めるため）。
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "notes<<RELEASE_NOTES_EOF"
            python3 scripts/release-notes.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # Web 配布物: UI を同梱した実行可能 jar
  web-jar:
    name: Web jar
    needs: verify-version
    # 上限を切る（2026-08-27 に macOS で Maven の取得が詰まり 2h11m かかった。通常 5〜6 分）。
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build web jar (UI 同梱 / frontend は Maven が内部ビルド)
        working-directory: backend
        # パッケージング工程はテストをスキップ（テストのゲートは ci.yml が担う）。
        run: |
          mvn -B -DskipTests clean package \
            -Dmaven.wagon.http.retryHandler.count=3 \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
            -Dmaven.wagon.http.connectionTimeout=30000 \
            -Dmaven.wagon.http.readTimeout=60000
      - name: Stage plugin API jar (第三者プラグイン開発者向け・fw/plugin-manager-design.md)
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cp backend/target/graphy-next-backend-plugin-api.jar "backend/target/graphy-plugin-api-${ver}.jar"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.verify-version.outputs.notes }}
          files: |
            backend/target/graphy-next-backend.jar
            backend/target/graphy-plugin-api-*.jar

  # デスクトップ配布物: 各 OS で Electron インストーラをビルド
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: verify-version
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # 上限を切る（2026-08-27 に macOS で Maven の取得が詰まり 2h11m かかった。通常 5〜6 分）。
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend jar + frontend (Maven 統合)
        shell: bash
        # パッケージング工程はテストをスキップ（テストのゲートは ci.yml が担う）。
        run: |
          cd backend && mvn -B -DskipTests clean package \
            -Dmaven.wagon.http.retryHandler.count=3 \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
            -Dmaven.wagon.http.connectionTimeout=30000 \
            -Dmaven.wagon.http.readTimeout=60000
      - name: Stage desktop resources
        shell: bash
        run: |
          rm -rf desktop/renderer desktop/resources/backend
          mkdir -p desktop/renderer desktop/resources/backend
          cp -r frontend/dist/. desktop/renderer/
          cp backend/target/graphy-next-backend.jar desktop/resources/backend/graphy-next-backend.jar
      - name: Bundle Java 21 runtime (jlink, このOS向け)
        shell: bash
        run: |
          rm -rf desktop/resources/jre
          "$JAVA_HOME/bin/jlink" --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --output desktop/resources/jre
      - name: Fetch ffmpeg (このOS/アーキ向けのみ)
        shell: bash
        run: |
          os=$(uname -s); arch=$(uname -m)
          case "$os" in Linux) os=linux;; Darwin) os=mac;; *) os=win;; esac
          case "$arch" in x86_64|amd64) arch=x64;; aarch64|arm64) arch=arm64;; *) arch=x64;; esac
          bash scripts/fetch-ffmpeg.sh "$os-$arch"
      # QR の findscu/movescu/getscu/storescu（Java 製・全OS共通）と、
      # 匿名化の焼き込みが圧縮画素を伸長するのに使う OpenCV ネイティブ（**このOS/アーキ向けのみ**）。
      #
      # 🔴 **--check を必ず通す。** extraResources は resources/dcm4che を丸ごと同梱するので、
      #    ネイティブが欠けていても・別プラットフォームのものが混ざっていても、
      #    インストーラは**問題なく出来上がってしまう**。実行時に初めて
      #    「圧縮画像の焼き込みだけ使えない」と分かる——リリース後に気付く類の壊れ方なので、
      #    ここで落とす。
      - name: Fetch dcm4che-tools (QR は全OS共通 / OpenCV ネイティブはこのOS向けのみ)
        shell: bash
        run: |
          bash scripts/fetch-dcm4che-tools.sh
          bash scripts/fetch-dcm4che-tools.sh --check
      # Google Colab に接続するための OAuth クライアント（デスクトップ アプリ型）を入れる。
      # 公開リポジトリには置かない（.gitignore）。secrets.GRAPHY_COLAB_OAUTH_CLIENT に Google から
      # ダウンロードした JSON（"installed"）をそのまま登録する。設計: fw/remote-compute-design.md §20。
      # 無ければ入れずに進む（Colab だけが「設定がありません」になる配布物）。あれば中身を確かめ、
      # 入ったことを check-packaged.js にも確かめさせる。
      - name: Write Colab OAuth client
        shell: bash
        env:
          COLAB_CLIENT: ${{ secrets.GRAPHY_COLAB_OAUTH_CLIENT }}
        run: |
          if [ -z "$COLAB_CLIENT" ]; then
            echo "::warning::secrets.GRAPHY_COLAB_OAUTH_CLIENT がありません。この配布物では Google Colab に接続できません。"
            exit 0
          fi
          printf '%s' "$COLAB_CLIENT" > desktop/colab-oauth-client.json
          node -e "const j=require('./desktop/colab-oauth-client.json'); if(!j.installed||!j.installed.client_id||!j.installed.client_secret){console.error('::error::colab-oauth-client.json に installed.client_id / client_secret がありません（デスクトップ アプリ型の JSON を登録してください）');process.exit(1)}"
          echo "GRAPHY_REQUIRE_COLAB_CLIENT=1" >> "$GITHUB_ENV"
      # 同梱の公式プラグイン（desktop/bundled-plugins.json）。GitHub Release から zip・sha256・minisig を取り、
      # **公式鍵の署名を確かめてから** desktop/resources/bundled-plugins に置く（起動時に backend がもう一度確かめて入れる）。
      # 署名の無い版は入れない（公式プラグインを署名なしで配らない）。取れなければ警告して同梱なしで進む。
      - name: Fetch bundled official plugins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=desktop/resources/bundled-plugins
          mkdir -p "$out"
          pub=$(yq -r '.graphy.plugins."trusted-keys"[0]' backend/src/main/resources/application.yml 2>/dev/null || true)
          if [ -z "$pub" ] || [ "$pub" = "null" ]; then
            pub=$(grep -A2 'trusted-keys:' backend/src/main/resources/application.yml | grep -o '"RW[^"]*"' | head -1 | tr -d '"')
          fi
          printf 'untrusted comment: official\n%s\n' "$pub" > /tmp/official.pub
          if ! command -v minisign >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq minisign 2>/dev/null || true; fi
          jq -c '.plugins[]' desktop/bundled-plugins.json | while read -r p; do
            repo=$(echo "$p" | jq -r .repo); ver=$(echo "$p" | jq -r .version)
            tmp=$(mktemp -d)
            if ! gh release download "v$ver" -R "$repo" -D "$tmp" -p '*.zip' -p '*.zip.sha256' -p '*.zip.minisig'; then
              echo "::warning::$repo v$ver を取得できません。同梱しません。"; continue
            fi
            zip=$(ls "$tmp"/*.zip | head -1)
            if [ ! -f "$zip.minisig" ]; then
              echo "::warning::$repo v$ver に署名（.minisig）がありません。公式プラグインは署名なしで同梱しません。"; continue
            fi
            (cd "$tmp" && sha256sum -c "$(basename "$zip").sha256")
            if command -v minisign >/dev/null; then
              minisign -V -p /tmp/official.pub -m "$zip" -x "$zip.minisig" \
                || { echo "::error::$repo v$ver の署名が公式鍵で検証できません"; exit 1; }
            fi
            cp "$zip" "$zip.minisig" "$out/"
            [ -f "$zip.sha256" ] && cp "$zip.sha256" "$out/"
            echo "bundled: $(basename "$zip")"
          done
          ls -la "$out"
      - name: Install desktop deps & build installer
        working-directory: desktop
        shell: bash
        # アップロードは softprops が担うため electron-builder 側は publish しない
        # （--publish never＋GH_TOKEN 非注入で app-update.yml 生成/repository 解決を回避）。
        run: |
          npm install
          # 🚨 起動に要るファイルが build.files に全部あるか（v0.3.0〜0.3.2 は secretStore.js 等が抜けて起動直後に落ちた）
          node --test packagedFiles.test.js
          npm run dist -- --publish never
      # 🚨 **公開の前に、できたインストーラの中身（app.asar）を確かめる。** 足りなければここで落ち、この OS の
      #    インストーラはアップロードされない。開発起動（desktop/ をそのまま読む）と CI では気付けない壊れ方
      #    （2026-09-30・fw/release-checklist.md）。
      - name: Check packaged app (起動に要るファイルが app.asar にあるか)
        working-directory: desktop
        shell: bash
        run: node scripts/check-packaged.js dist
      - name: Upload installers
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.verify-version.outputs.notes }}
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/*.dmg
