<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>GRAPHY ビューアの起動 / Start the viewer</title>
<style>
:root{--bg:#0c0e11;--panel:#12151a;--card:#171b21;--line:#262b33;--text:#e8ebef;--muted:#9ba5b3;--accent:#5aaeff;--on:#06101c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.7 system-ui,"Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-weight:650;letter-spacing:.02em}
header .sp{flex:1}
.seg{display:flex;background:#1a1e24;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 12px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:#2a3442;color:var(--text)}
main{max-width:760px;margin:0 auto;padding:32px 24px 48px}
h1{font-size:30px;line-height:1.4;margin:0 0 24px}
.fine{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}
.os{color:var(--muted);font-size:14px;margin:0 0 8px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 16px}
.file code{font:700 30px ui-monospace,Consolas,"SF Mono",monospace;background:var(--bg);border:2px solid var(--accent);border-radius:12px;padding:12px 24px}
.btn{font:inherit;font-size:13px;border:1px solid #2f4258;background:#1a2635;color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
.btn:hover{filter:brightness(1.2)}
.btn:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{color:var(--accent);font-size:14px;min-height:1.7em;margin:0}
ol{margin:8px 0 0;padding-left:1.4em}
ol li{margin:4px 0}
details{margin-top:4px}
summary{cursor:pointer;color:var(--muted)}
.others{margin:12px 0 0;padding:0;list-style:none}
.others li{padding:8px 0;border-top:1px solid var(--line)}
.others code{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.others li.here code{border-color:var(--accent)}
.notice{border-left:4px solid #c9a227;background:#1c1a12;border-radius:0 10px 10px 0;padding:12px 16px;font-size:14px;margin:0 0 20px}
.notice b{display:block;margin-bottom:2px}
footer{color:var(--muted);font-size:14px;text-align:center;border-top:1px solid var(--line);padding-top:16px}
footer b{color:var(--text)}
</style>
</head>
<body>
<header>
  <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="#1a2330" stroke="#33404f"/><path d="M7 12h10M12 7v10" stroke="#5aaeff" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="6.5" stroke="#5aaeff" stroke-width="1.5" fill="none"/></svg>
  <b>GRAPHY</b><span class="sp"></span>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" id="lang-ja" aria-pressed="true">日本語</button>
    <button type="button" id="lang-en" aria-pressed="false">English</button>
  </div>
</header>
<main>
  <h1 id="t-title"></h1>

  <section class="card" aria-labelledby="t-os">
    <p class="os" id="t-os"></p>
    <div id="files"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <ol id="steps"></ol>
    <details id="other-box">
      <summary id="t-other"></summary>
      <ul class="others" id="others"></ul>
    </details>
  </section>

  <p class="fine" id="t-lead"></p>
  <p class="fine" id="t-why"></p>
  <br>
  <div class="notice" role="note"><b id="t-notice-h"></b><span id="t-notice"></span></div>

  <footer>
    <div id="t-sign-by"></div>
    <div><b>Visionary Imaging Services, Inc.</b></div>
  </footer>
</main>
<script>
(function () {
  "use strict";
  var FILES = { windows: "START-VIEWER.bat", mac: "START-VIEWER.command", linux: "START-VIEWER.sh" };
  var OS_LABEL = {
    ja: { windows: "Windows", mac: "Mac", linux: "Linux" },
    en: { windows: "Windows", mac: "Mac", linux: "Linux" }
  };
  var LAUNCH = {
    ja: { windows: "ダブルクリックします。", mac: "ダブルクリックします（開けないときは、右クリック →「開く」）。", linux: "ターミナルで次のコマンドを実行します：sh START-VIEWER.sh" },
    en: { windows: "Double-click it.", mac: "Double-click it (if it does not open: right-click > Open).", linux: "Run this in a terminal: sh START-VIEWER.sh" }
  };
  var EXTRA = {
    ja: { mac: "開けないときは、右クリック →「開く」を選びます。" },
    en: { mac: "If it does not open: right-click > Open." }
  };
  var T = {
    ja: {
      title: "下のファイルをダブルクリックして実行してください",
      titleRun: "下のファイルを実行してください",
      lead: "このフォルダの画像を、付属のビューアで見ます。インストールは要りません。",
      osKnown: "このパソコン（%OS%）では、次のファイルを実行します",
      osUnknown: "お使いの環境を判定できませんでした。お使いの OS に合うファイルを、下から選んで実行します",
      copy: "ファイル名をコピー", copied: "コピーしました：", copyFail: "コピーできませんでした。ファイル名を選んでコピーしてください。",
      s1: "上のファイルをダブルクリックします。", s2: "ブラウザが開き、画像が表示されます。", s3: "終わるときは、黒い画面を閉じます。",
      other: "ほかの OS の場合", here: "（このパソコン）",
      why: "ブラウザの安全のための制限で、このページから直接ビューアを起動することはできません。上のファイルをご自身でダブルクリックしてください。画像はこのパソコンの外へは送られません。",
      noticeH: "ご注意（非診断用）",
      notice: "この付属ビューアは、診断や治療方針の決定を目的としたものではありません（非診断用）。画像の参照・共有のための表示です。診断には、承認・認証を受けた医療機器または診断用ビューアと、元の画像をお使いください。",
      signBy: "Exported by GRAPHY"
    },
    en: {
      title: "Double-click the file below to start",
      titleRun: "Run the file below to start",
      lead: "Use the bundled viewer to look at the images in this folder. No installation is needed.",
      osKnown: "On this computer (%OS%), run this file",
      osUnknown: "Your system could not be detected. Choose the file for your OS below and run it",
      copy: "Copy file name", copied: "Copied: ", copyFail: "Could not copy. Please select the file name and copy it.",
      s1: "Double-click the file above.", s2: "Your browser opens and shows the images.", s3: "To finish, close the black window.",
      other: "Other operating systems", here: " (this computer)",
      why: "For browser security, this page cannot start the viewer by itself. Please double-click the file above yourself. Images are never sent outside this computer.",
      noticeH: "Notice (not for diagnostic use)",
      notice: "This bundled viewer is not intended for diagnosis or for deciding treatment (not for diagnostic use). It is provided for reviewing and sharing images. For diagnosis, please use an approved or certified medical device or diagnostic viewer together with the original images.",
      signBy: "Exported by GRAPHY"
    }
  };

  function detect() {
    var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
    var s = (p + " " + (navigator.userAgent || "")).toLowerCase();
    if (/android|iphone|ipad|ipod/.test(s)) return "unknown"; // スマートフォン・タブレットでは起動できない
    if (/windows|win32|win64/.test(s)) return "windows";
    if (/mac/.test(s)) return "mac";
    if (/linux|x11|cros/.test(s)) return "linux";
    return "unknown";
  }

  var os = detect();
  var lang = /^ja/i.test(navigator.language || "") ? "ja" : "en";

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function $(id) { return document.getElementById(id); }

  function copy(name) {
    var t = T[lang];
    var done = function () { $("status").textContent = t.copied + name; };
    var fail = function () { $("status").textContent = t.copyFail; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(name).then(done, fail);
      else fail();
    } catch (e) { fail(); }
  }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    $("lang-ja").setAttribute("aria-pressed", String(lang === "ja"));
    $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    $("t-title").textContent = os === "windows" || os === "mac" ? t.title : t.titleRun;
    $("t-lead").textContent = t.lead;
    $("t-os").textContent = os === "unknown" ? t.osUnknown : t.osKnown.replace("%OS%", OS_LABEL[lang][os]);
    $("status").textContent = "";

    var box = $("files");
    box.textContent = "";
    var primary = os === "unknown" ? ["windows", "mac", "linux"] : [os];
    primary.forEach(function (k) {
      var row = el("div", undefined, "file primary-file");
      row.setAttribute("data-os", k);
      if (os === "unknown") row.appendChild(el("span", OS_LABEL[lang][k] + "："));
      row.appendChild(el("code", FILES[k]));
      var b = el("button", t.copy, "btn");
      b.type = "button";
      b.addEventListener("click", function () { copy(FILES[k]); });
      row.appendChild(b);
      box.appendChild(row);
    });

    var steps = $("steps");
    steps.textContent = "";
    steps.appendChild(el("li", os === "linux" ? LAUNCH[lang].linux : t.s1 + (os === "mac" ? " " + EXTRA[lang].mac : "")));
    steps.appendChild(el("li", t.s2 + " " + t.s3));

    $("t-other").textContent = t.other;
    var list = $("others");
    list.textContent = "";
    ["windows", "mac", "linux"].forEach(function (k) {
      var li = el("li", undefined, k === os ? "here" : "");
      li.setAttribute("data-os", k);
      li.appendChild(el("b", OS_LABEL[lang][k] + (k === os ? t.here : "") + "："));
      li.appendChild(document.createTextNode(" "));
      li.appendChild(el("code", FILES[k]));
      li.appendChild(document.createElement("br"));
      li.appendChild(document.createTextNode(LAUNCH[lang][k]));
      list.appendChild(li);
    });
    $("other-box").open = os === "unknown";

    $("t-why").textContent = t.why;
    $("t-notice-h").textContent = t.noticeH;
    $("t-notice").textContent = t.notice;
    $("t-sign-by").textContent = t.signBy;
  }

  $("lang-ja").addEventListener("click", function () { lang = "ja"; render(); });
  $("lang-en").addEventListener("click", function () { lang = "en"; render(); });
  render();
})();
</script>
</body>
</html>
