# standalone プロファイル: Electron デスクトップアプリモード
# 将来: 組み込み DICOM サーバー / H2 索引 / ローカル FS の設定をここに追加。
# HTTP はこの PC（127.0.0.1）からだけ受ける。
# 認証が無いので、LAN に開くと同じ LAN の誰でも患者情報の読み出し・改ざん・設定変更ができてしまう。
# HTTP を使うのは同じ PC の Electron の画面だけ（http://localhost:<port>）。LAN から受けるのは
# DICOM の受信（SCP、graphy.dicom.scp.bind-address）だけで、これは別のポートなので影響しない。
# H2 を 127.0.0.1 に限っている（GraphyNextApplication の h2.bindAddress）のと同じ考え方。
server:
  address: 127.0.0.1

graphy:
  mode-description: "Standalone desktop mode (Electron, embedded resources)"
  dicom:
    scp:
      enabled: true       # ローカル DIMSE リスナー（C-ECHO 応答）を起動
    # DICOM 通信ノード（DICOM Send=C-STORE 送信先 / Query-Retrieve=C-FIND/C-MOVE 接続先の共通候補）。
    # 環境設定「DICOM 通信ノード」からも編集でき（Settings(H2) に保存され、こことマージされる）、
    # 送信ダイアログでは手動入力もできるため、未設定でも送信は可能。tls: true でそのノードへ DIMSE TLS 接続
    # （鍵/信頼ストア等は graphy.dicom.tls のグローバル設定を共用）。
    # remote-aes:
    #   - ae-title: DCM4CHEE
    #     host: 127.0.0.1
    #     port: 11112
    #     tls: false
    #   - ae-title: ORTHANC
    #     host: 192.168.1.50
    #     port: 4242
    #     tls: false

# NonDicomImporter の動画(AVI/非H.264 MP4)トランスコード用 ffmpeg。
# 既定（空）の場合、FfmpegLocator が同梱物を自動探索する:
#   jar 隣接の ffmpeg/ ・ ../ffmpeg/（Electron: resources/ffmpeg）→ <os-arch>/ffmpeg[.exe]
# 明示パスや同梱ディレクトリを指定したい場合のみ設定する（環境変数 GRAPHY_FFMPEG / GRAPHY_FFMPEG_DIR も可）。
nondicom:
  ffmpeg: ""        # 実行ファイルの明示パス（例 C:\\tools\\ffmpeg.exe）
  ffmpeg-dir: ""    # 同梱ディレクトリ（<os-arch>/ffmpeg[.exe] または直下に ffmpeg[.exe]）
